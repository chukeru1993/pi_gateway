<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pi Gateway Tester</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:#0d1117;color:#c9d1d9;height:100vh;overflow:hidden;
}
pre,code{font-family:"SF Mono","Fira Code","Cascadia Code",monospace}
/* toolbar */
.toolbar{
  display:flex;align-items:center;gap:10px;padding:8px 12px;
  background:#161b22;border-bottom:1px solid #21262d;height:44px;
}
.toolbar label{font-size:12px;color:#8b949e;white-space:nowrap}
.toolbar input{
  background:#0d1117;border:1px solid #30363d;border-radius:4px;
  color:#c9d1d9;padding:4px 8px;font-size:12px;font-family:inherit;
}
.toolbar input:focus{outline:none;border-color:#58a6ff}
#gateway-url{width:200px}
#jwt-token{width:260px}
#conn-status{font-size:11px;padding:2px 8px;border-radius:10px;margin-left:auto}
.status-ok{background:#033a16;color:#3fb950}
.status-err{background:#3a0316;color:#f85149}
.status-check{background:#1a2332;color:#8b949e}
/* main layout */
.main{display:flex;height:calc(100vh - 44px)}
/* sessions panel */
.sessions-panel{
  width:220px;min-width:180px;background:#161b22;border-right:1px solid #21262d;
  display:flex;flex-direction:column;overflow:hidden;
}
.sessions-header{
  padding:8px 10px;border-bottom:1px solid #21262d;
  font-size:12px;font-weight:600;color:#58a6ff;
  display:flex;justify-content:space-between;align-items:center;
}
.sessions-header button{
  background:#238636;border:none;color:#fff;font-size:18px;line-height:1;
  width:24px;height:24px;border-radius:4px;cursor:pointer;
}
.sessions-header button:hover{background:#2ea043}
.sessions-list{flex:1;overflow-y:auto;padding:4px}
.session-item{
  padding:6px 8px;font-size:11px;border-radius:4px;cursor:pointer;
  margin-bottom:2px;display:flex;justify-content:space-between;align-items:center;
  border:1px solid transparent;
}
.session-item:hover{background:#1c2128}
.session-item.active{border-color:#58a6ff;background:#0d419d33}
.session-item .sid{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.session-item .del-btn{
  visibility:hidden;color:#f85149;cursor:pointer;font-size:14px;line-height:1;
  padding:0 4px;border:none;background:none;
}
.session-item:hover .del-btn{visibility:visible}
.session-item .del-btn:hover{color:#ff7b72}
.session-actions{
  padding:6px 10px;border-top:1px solid #21262d;
  display:flex;flex-direction:column;gap:4px;
}
.session-actions button{
  background:#21262d;border:1px solid #30363d;border-radius:4px;
  color:#c9d1d9;font-size:11px;padding:5px 8px;cursor:pointer;text-align:left;
}
.session-actions button:hover{background:#30363d}
/* right panel */
.right-panel{flex:1;display:flex;flex-direction:column;overflow:hidden}
/* chat area */
.chat-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.chat-input-row{
  display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid #21262d;
  background:#161b22;
}
.chat-input-row input{
  flex:1;background:#0d1117;border:1px solid #30363d;border-radius:4px;
  color:#c9d1d9;padding:6px 10px;font-size:13px;font-family:inherit;
}
.chat-input-row input:focus{outline:none;border-color:#58a6ff}
.chat-input-row button{
  background:#238636;border:none;border-radius:4px;color:#fff;
  padding:6px 14px;font-size:12px;cursor:pointer;white-space:nowrap;
}
.chat-input-row button:hover{background:#2ea043}
.chat-input-row button.abort{background:#da3633}
.chat-input-row button.abort:hover{background:#f85149}
/* output */
.output{flex:1;overflow-y:auto;padding:8px 10px;font-size:12px;font-family:inherit}
    .output .line{margin-bottom:2px;line-height:1.5;word-break:break-all}
    .output .thinking{color:#8b949e;font-style:italic}
    .output .text{color:#c9d1d9}
    .output .event{color:#58a6ff;font-size:10px;text-transform:uppercase}
    .output .error{color:#f85149;background:#3a0316;padding:2px 6px;border-radius:3px}
    .output .ui-request{color:#d29922;background:#2a210f;padding:2px 6px;border-radius:3px}
    .output .info{color:#8b949e;font-size:10px}
    .output .divider{color:#30363d;margin:4px 0}
  /* interactive widget */
  .ui-widget{margin:10px 0;border:1px solid #3a2f1a;border-radius:10px;background:#1c180d;overflow:hidden;box-shadow:0 1px 4px #0003}
  .ui-widget-header{font-size:11px;color:#d29922;padding:8px 12px;background:#241f10;border-bottom:1px solid #3a2f1a;display:flex;justify-content:space-between;align-items:center}
  .ui-widget-body{padding:10px 14px}
  .ui-widget-msg{font-size:12px;color:#c9d1d9;line-height:1.6;margin-bottom:10px;word-break:break-word}
  .ui-widget-title{font-size:12px;font-weight:600;color:#e6edf3;margin-bottom:8px;word-break:break-word}
  .ui-widget-options{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
  .ui-widget-btn{font-size:12px;padding:8px 14px;border-radius:6px;border:1px solid;cursor:pointer;font-family:inherit;transition:opacity .15s}
  .ui-widget-btn:hover{opacity:.85}
  .ui-widget-btn:disabled{opacity:.4;cursor:not-allowed}
  .ui-widget-btn-option{background:#242015;color:#d29922;border-color:#3a2f1a;text-align:left}
  .ui-widget-btn-option:hover{background:#2e281c;border-color:#5a452a}
  .ui-widget-btn-option.selected{background:#1f6000;color:#c9d1d9;border-color:#238636}
  .ui-widget-btn-confirm{background:#238636;color:#fff;border-color:#2ea043}
  .ui-widget-btn-cancel{background:#21262d;color:#c9d1d9;border-color:#30363d}
  .ui-widget-btn-cancel:hover{background:#30363d}
  .ui-widget-input-row{display:flex;gap:8px;margin-bottom:6px}
  .ui-widget-input-row input{margin:0;flex:1;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;padding:7px 10px;font-size:13px;font-family:inherit}
  .ui-widget-input-row input:focus{outline:none;border-color:#58a6ff}
  .ui-widget-input-row textarea{flex:1;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;padding:8px 10px;font-size:12px;font-family:monospace;resize:vertical;min-height:80px;line-height:1.5}
  .ui-widget-input-row textarea:focus{outline:none;border-color:#58a6ff}
  .ui-widget-input-row button{white-space:nowrap}
  .ui-widget-result{font-size:11px;color:#3fb950;padding:6px 10px;border-top:1px solid #3a2f1a;background:#033a1611}
  .ui-widget-result.cancelled{color:#f85149;background:#3a031611}
  .ui-widget-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
/* shortcuts panel */
.shortcuts{
  border-top:1px solid #21262d;background:#161b22;padding:6px 10px;
  display:flex;gap:6px;flex-wrap:wrap;align-items:center;
}
.shortcuts span{font-size:10px;color:#484f58;text-transform:uppercase;margin-right:4px}
.shortcuts button{
  background:#21262d;border:1px solid #30363d;border-radius:4px;
  color:#c9d1d9;font-size:11px;padding:4px 10px;cursor:pointer;
}
.shortcuts button:hover{background:#30363d}
.shortcuts button.running{background:#d2992222;border-color:#d29922}
/* response overlay */
.response-overlay{
  display:none;position:absolute;top:0;left:0;right:0;bottom:0;
  background:#0d1117e6;z-index:10;flex-direction:column;
}
.response-overlay.show{display:flex}
.response-header{
  padding:8px 12px;background:#161b22;border-bottom:1px solid #21262d;
  display:flex;justify-content:space-between;align-items:center;
}
.response-header span{font-size:13px;font-weight:600;color:#58a6ff}
.response-header button{
  background:none;border:none;color:#8b949e;font-size:18px;cursor:pointer;
}
.response-header button:hover{color:#c9d1d9}
.response-body{
  flex:1;overflow:auto;padding:12px;
}
.response-body pre{
  font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-all;
}
.scroll-bottom{float:right;font-size:10px;color:#484f58;cursor:pointer}
  /* markdown content styles */
  .md-content p{margin:4px 0;line-height:1.6}
  .md-content code{font-family:"SF Mono","Fira Code","Cascadia Code",monospace;font-size:11px;background:#1c2128;padding:1px 5px;border-radius:3px}
  .md-content pre{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:10px 12px;overflow-x:auto;margin:6px 0}
  .md-content pre code{background:none;padding:0;font-size:11px;line-height:1.5;color:#c9d1d9}
  .md-content blockquote{border-left:3px solid #58a6ff;padding:4px 12px;margin:6px 0;color:#8b949e}
  .md-content ul,.md-content ol{padding-left:24px;margin:4px 0}
  .md-content li{line-height:1.6}
  .md-content table{border-collapse:collapse;margin:6px 0;width:100%}
  .md-content th,.md-content td{border:1px solid #30363d;padding:4px 10px;font-size:11px;text-align:left}
  .md-content th{background:#1c2128}
  .md-content h1,.md-content h2,.md-content h3,.md-content h4{font-weight:600;margin:10px 0 4px;line-height:1.3}
  .md-content h1{font-size:16px;color:#58a6ff}
  .md-content h2{font-size:14px;color:#58a6ff}
  .md-content h3{font-size:13px;color:#c9d1d9}
  .md-content hr{border:none;border-top:1px solid #30363d;margin:8px 0}
  .md-content a{color:#58a6ff;text-decoration:none}
  .md-content a:hover{text-decoration:underline}
  .md-content strong{font-weight:600;color:#e6edf3}
  .md-content em{font-style:italic}
/* message bubbles */
.msg{margin:8px 0;max-width:85%;clear:both}
  .msg-user{float:right}
  .msg-user .msg-content{background:#1f6feb33;color:#c9d1d9;border-radius:12px 12px 2px 12px;padding:10px 14px;font-size:13px;word-break:break-word;border:1px solid #1f6feb66;box-shadow:0 1px 3px #0003}
  .msg-ai{float:left;width:100%}
  .msg-ai .msg-content{background:#161b22;border:1px solid #30363d;border-radius:12px 12px 12px 2px;padding:10px 14px;font-size:13px;word-break:break-word;box-shadow:0 1px 3px #0003}
  .msg-ai .msg-label{font-size:10px;color:#8b949e;margin-bottom:4px;font-weight:600}
  .msg::after{content:"";display:table;clear:both}
  /* thinking block */
  .thinking-block{margin:8px 0;border:1px dashed #30363d;border-radius:8px;background:#0d1117;overflow:hidden}
  .thinking-header{font-size:11px;color:#8b949e;padding:6px 12px;background:#161b22;border-bottom:1px dashed #30363d;cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none}
  .thinking-header:hover{color:#c9d1d9}
  .thinking-body{padding:8px 12px;font-size:12px;color:#8b949e;font-style:italic;line-height:1.6;white-space:pre-wrap;word-break:break-word;display:none}
  .thinking-body.expanded{display:block}
  .thinking-toggle{font-size:10px;color:#484f58}
  /* tool call block */
  .toolcall-block{margin:8px 0;border:1px solid #30203f;border-radius:8px;background:#16101f;overflow:hidden}
  .toolcall-header{font-size:11px;color:#d2a8ff;padding:6px 12px;background:#1c1026;border-bottom:1px solid #30203f;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
  .toolcall-header:hover{background:#251236}
  .toolcall-body{padding:8px 12px;font-size:12px;display:none}
  .toolcall-body.expanded{display:block}
   .toolcall-body pre{margin:0;background:#0d1117;border:1px solid #30203f;border-radius:6px;padding:8px 10px;overflow-x:auto;font-size:11px;line-height:1.5;color:#c9d1d9}
  .toolcall-body code{font-size:11px;color:#d2a8ff;background:#0d1117}
  .toolcall-body .md-content p{margin:4px 0;line-height:1.5}
  .toolcall-body .md-content code{font-family:monospace;font-size:11px;background:#0d1117;padding:1px 4px;border-radius:3px;color:#d2a8ff}
  .toolcall-body .md-content pre{background:#0d1117;border:1px solid #30203f;border-radius:6px;padding:8px 10px;overflow-x:auto;margin:4px 0}
  .toolcall-body .md-content pre code{background:none;padding:0;color:#c9d1d9}
  /* tool execution block */
  .toolexec-block{margin:8px 0;background:#0d1f33;border:1px solid #1f3a5f;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px #0003}
  .toolexec-header{font-size:11px;color:#a5d6ff;padding:6px 12px;background:#0a1628;border-bottom:1px solid #1f3a5f;font-family:monospace;display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
  .toolexec-header:hover{background:#0d1f33}
  .toolexec-body{padding:8px 12px;font-size:12px;display:none}
  .toolexec-body.expanded{display:block}
  .toolexec-body pre{margin:0;background:#0d1117;border:1px solid #1f3a5f;border-radius:6px;padding:8px 10px;overflow-x:auto;max-height:400px;font-size:11px;line-height:1.5;color:#c9d1d9}
  .toolexec-body .md-content p{margin:4px 0;line-height:1.5}
  .toolexec-body .md-content code{font-family:monospace;font-size:11px;background:#0d1117;padding:1px 4px;border-radius:3px;color:#a5d6ff}
  .toolexec-body .md-content pre{background:#0d1117;border:1px solid #1f3a5f;border-radius:6px;padding:8px 10px;overflow-x:auto;margin:4px 0}
  .toolexec-body .md-content pre code{background:none;padding:0;color:#c9d1d9}
  .toolexec-exit{font-size:10px;color:#484f58;padding:4px 12px;border-top:1px solid #1f3a5f;background:#0a1628}
  /* usage info */
  .msg-meta{font-size:10px;color:#484f58;text-align:right;margin-top:4px}
  </style>
</head>
<body>

<div class="toolbar">
  <label>Gateway:</label>
  <input id="gateway-url" value="http://localhost:3000" placeholder="http://host:port">
  <label>Token:</label>
  <input id="jwt-token" placeholder="JWT token..." type="password">
  <span id="conn-status" class="status-check">checking...</span>
</div>

<div class="main">
  <!-- left: sessions -->
  <div class="sessions-panel">
    <div class="sessions-header">
      Sessions
      <button id="btn-create-session" title="新建会话">+</button>
    </div>
    <div id="sessions-list" class="sessions-list"></div>
    <div class="session-actions">
      <button id="btn-delete-session">删除选中会话</button>
    </div>
  </div>

  <!-- right: chat + shortcuts + response -->
  <div class="right-panel" style="position:relative">
    <div class="chat-area">
      <div class="chat-input-row">
        <input id="chat-input" placeholder="输入消息后回车发送..." disabled>
        <button id="btn-send" disabled>发送</button>
        <button id="btn-abort" class="abort" style="display:none">中断</button>
      </div>
      <div id="output" class="output">
        <div class="info">等待创建会话...</div>
      </div>
    </div>
    <div class="shortcuts">
      <span>快捷操作:</span>
      <button onclick="quickAction('state')">State</button>
      <button onclick="quickAction('models')">Models</button>
      <button onclick="quickAction('stats')">Stats</button>
      <button onclick="quickAction('bash')">Bash: echo ok</button>
      <button onclick="quickAction('config')">Config</button>
      <button onclick="quickAction('pending-ui')">Pending UI</button>
      <button onclick="quickAction('messages')">Messages</button>
    </div>

    <!-- response overlay -->
    <div id="response-overlay" class="response-overlay">
      <div class="response-header">
        <span id="response-title">Response</span>
        <button onclick="closeResponse()">&times;</button>
      </div>
      <div id="response-body" class="response-body"></div>
    </div>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);

// --- state ---
let currentSessionId = null;
let abortController = null;
let currentMsgContent = null;

// --- persistence ---
function savePrefs() {
  localStorage.setItem('gw-url', $('#gateway-url').value);
  localStorage.setItem('gw-token', $('#jwt-token').value);
}
$('#gateway-url').addEventListener('input', savePrefs);
$('#jwt-token').addEventListener('input', savePrefs);
$('#gateway-url').value = localStorage.getItem('gw-url') || 'http://localhost:3000';
$('#jwt-token').value = localStorage.getItem('gw-token') || '';

function baseUrl(){ return $('#gateway-url').value.replace(/\/+$/, ''); }
function authHeaders(){ return { 'Authorization': 'Bearer ' + $('#jwt-token').value, 'Content-Type': 'application/json' }; }

// --- connection check ---
async function checkConnection(){
  const s = $('#conn-status');
  s.className = 'status-check'; s.textContent = 'checking...';
  try {
    const r = await fetch(baseUrl() + '/health');
    if (r.ok && (await r.json()).status === 'ok') { s.className = 'status-ok'; s.textContent = 'connected'; return true; }
  } catch(e) {}
  s.className = 'status-err'; s.textContent = 'disconnected'; return false;
}
$('#gateway-url').addEventListener('change', checkConnection);
$('#gateway-url').addEventListener('blur', checkConnection);
checkConnection();

// --- output ---
let streamBlock = null;
let streamBuffer = '';
let streamBlockType = '';
const toolcallBlocks = {};

function outputAppend(html) {
  const target = currentMsgContent || $('#output');
  target.insertAdjacentHTML('beforeend', html);
  $('#output').scrollTop = $('#output').scrollHeight;
}
function outputAppendBlock(tag, cls) {
  streamBlock = document.createElement(tag);
  streamBlock.className = cls;
  streamBuffer = '';
  streamBlockType = cls;
  const target = currentMsgContent || $('#output');
  target.appendChild(streamBlock);
  $('#output').scrollTop = $('#output').scrollHeight;
}
function outputAppendTo(block) {
  streamBlock = block;
  streamBuffer = block.textContent || '';
  streamBlockType = 'custom';
}
function outputAppendStream(text) {
  if (streamBlock) {
    streamBuffer += text;
    if (streamBlockType === 'text') {
      streamBlock.textContent = streamBuffer;
    } else {
      streamBlock.textContent += text;
    }
  }
  $('#output').scrollTop = $('#output').scrollHeight;
}
function outputEndStream() {
  if (streamBlock && (streamBlockType === 'text' || streamBlock?.className === 'text') && streamBuffer) {
    streamBlock.className += ' md-content';
    streamBlock.innerHTML = renderMarkdown(streamBuffer);
  }
  streamBlock = null;
  streamBuffer = '';
  streamBlockType = '';
  $('#output').scrollTop = $('#output').scrollHeight;
}
function outputClear() { $('#output').innerHTML = ''; streamBlock = null; streamBuffer = ''; streamBlockType = ''; currentMsgContent = null; Object.keys(toolcallBlocks).forEach(k => delete toolcallBlocks[k]); }

// --- response overlay ---
function showResponse(title, text) {
  $('#response-title').textContent = title;
  $('#response-body').innerHTML = '<pre>' + escapeHtml(text) + '</pre>';
  $('#response-overlay').classList.add('show');
}
function closeResponse() { $('#response-overlay').classList.remove('show'); }

function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderMarkdown(text) {
  if (!text) return escapeHtml(text || '');
  try {
    if (typeof marked !== 'undefined' && marked.parse) {
      return marked.parse(text);
    }
  } catch(e) {}
  return escapeHtml(text).replace(/\n/g, '<br>');
}

function extractToolResult(result) {
  if (!result) return undefined;
  if (typeof result === 'string') return result;
  if (result.content) {
    if (Array.isArray(result.content)) {
      const first = result.content[0];
      if (first && typeof first === 'object' && 'text' in first) return first.text;
      if (first && typeof first === 'string') return first;
    } else if (typeof result.content === 'string') {
      return result.content;
    }
  }
  if (result.output) return result.output;
  if (result.stdout) return result.stdout;
  if (result.stderr) return result.stderr;
  if (result.text) return result.text;
  if (result.message) return result.message;
  if (result.details && Object.keys(result.details).length > 0) {
    return JSON.stringify(result.details, null, 2);
  }
  return undefined;
}

function toggleFold(parentId, bodyClass) {
  const parent = document.getElementById(parentId);
  if (!parent) return;
  const body = parent.querySelector('.' + bodyClass);
  if (!body) return;
  const isExpanded = body.classList.toggle('expanded');
  const header = parent.querySelector('.thinking-header, .toolcall-header, .toolexec-header');
  if (header) {
    const toggleSpan = header.querySelector('.thinking-toggle, .fold-toggle');
    if (toggleSpan) toggleSpan.textContent = isExpanded ? '点击折叠' : '点击展开';
  }
}

async function sendUIResponse(requestId, payload) {
  if (!currentSessionId) return;
  const body = { id: requestId, ...payload };
  try {
    const r = await fetch(baseUrl() + '/sessions/' + currentSessionId + '/ui-response', {
      method: 'POST', headers: authHeaders(),
      body: JSON.stringify(body),
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({ error: r.statusText }));
      alert('响应失败: ' + (err.error || err.message));
      return false;
    }
    return true;
  } catch(e) {
    alert('Error: ' + e.message);
    return false;
  }
}

function buildUIWidget(q) {
  const widget = document.createElement('div');
  widget.className = 'ui-widget';
  widget.dataset.requestId = q.id;

  const header = document.createElement('div');
  header.className = 'ui-widget-header';
  header.innerHTML = '❓ ' + escapeHtml(q.method.toUpperCase()) + ': ' + escapeHtml(q.title || '');
  widget.appendChild(header);

  const body = document.createElement('div');
  body.className = 'ui-widget-body';

  if (q.message) {
    const msg = document.createElement('div');
    msg.className = 'ui-widget-msg';
    msg.innerHTML = renderMarkdown(q.message);
    body.appendChild(msg);
  }

  function disableAll() {
    if (widget._submitted) return;
    widget._submitted = true;
    if (widget._keyHandler) document.removeEventListener('keydown', widget._keyHandler);
    widget.querySelectorAll('.ui-widget-btn, button, input, textarea').forEach(el => el.disabled = true);
  }

  function showResult(text, cancelled) {
    const result = document.createElement('div');
    result.className = 'ui-widget-result' + (cancelled ? ' cancelled' : '');
    result.textContent = text;
    widget.appendChild(result);
  }

  switch(q.method) {
    case 'confirm': {
      const footer = document.createElement('div');
      footer.className = 'ui-widget-footer';
      const btnYes = document.createElement('button');
      btnYes.className = 'ui-widget-btn ui-widget-btn-confirm';
      btnYes.textContent = '确认';
      const btnNo = document.createElement('button');
      btnNo.className = 'ui-widget-btn ui-widget-btn-cancel';
      btnNo.textContent = '取消';
      const confirmHandler = async () => {
        if (widget._submitted) return;
        widget._submitted = true;
        disableAll();
        const ok = await sendUIResponse(q.id, { confirmed: true });
        if (ok) showResult('已确认', false);
        else showResult('提交失败', true);
      };
      const cancelHandler = async () => {
        if (widget._submitted) return;
        widget._submitted = true;
        disableAll();
        const ok = await sendUIResponse(q.id, { cancelled: true });
        if (ok) showResult('已取消', true);
        else showResult('提交失败', true);
      };
      btnYes.onclick = confirmHandler;
      btnNo.onclick = cancelHandler;
      widget._keyHandler = (e) => {
        if (e.key === 'Enter') { e.preventDefault(); confirmHandler(); }
        else if (e.key === 'Escape') { e.preventDefault(); cancelHandler(); }
      };
      document.addEventListener('keydown', widget._keyHandler);
      footer.appendChild(btnYes);
      footer.appendChild(btnNo);
      body.appendChild(footer);
      break;
    }
    case 'select': {
      if (q.options && q.options.length > 0) {
        const opts = document.createElement('div');
        opts.className = 'ui-widget-options';
        q.options.forEach((opt, i) => {
          const btn = document.createElement('button');
          btn.className = 'ui-widget-btn ui-widget-btn-option';
          btn.textContent = (i + 1) + '. ' + opt;
          btn.onclick = async () => {
            if (widget._submitted) return;
            widget._submitted = true;
            disableAll();
            btn.classList.add('selected');
            const ok = await sendUIResponse(q.id, { value: opt });
            if (ok) showResult('已选择: ' + opt, false);
            else showResult('提交失败', true);
          };
          opts.appendChild(btn);
        });
        body.appendChild(opts);
        const footer = document.createElement('div');
        footer.className = 'ui-widget-footer';
        const btnCancel = document.createElement('button');
        btnCancel.className = 'ui-widget-btn ui-widget-btn-cancel';
        btnCancel.textContent = '取消';
        btnCancel.onclick = async () => {
          if (widget._submitted) return;
          widget._submitted = true;
          disableAll();
          const ok = await sendUIResponse(q.id, { cancelled: true });
          if (ok) showResult('已取消', true);
          else showResult('提交失败', true);
        };
        footer.appendChild(btnCancel);
        body.appendChild(footer);
        widget._keyHandler = (e) => {
          if (e.key === 'Escape') { e.preventDefault(); btnCancel.click(); }
        };
        document.addEventListener('keydown', widget._keyHandler);
      } else {
        const info = document.createElement('div');
        info.style.cssText = 'color:#8b949e;font-size:12px;padding:4px 0';
        info.textContent = '(无可用选项)';
        body.appendChild(info);
      }
      break;
    }
    case 'input': {
      const row = document.createElement('div');
      row.className = 'ui-widget-input-row';
      const input = document.createElement('input');
      input.placeholder = q.placeholder || '请输入...';
      input.value = q.prefill || '';
      const btn = document.createElement('button');
      btn.className = 'ui-widget-btn ui-widget-btn-confirm';
      btn.textContent = '提交';
      btn.disabled = !input.value.trim();
      input.oninput = () => { btn.disabled = !input.value.trim(); };
      input.onkeydown = (e) => { if (e.key === 'Enter' && !btn.disabled) btn.click(); };
      btn.onclick = async () => {
        const val = input.value.trim();
        if (!val) return;
        disableAll();
        const ok = await sendUIResponse(q.id, { value: val });
        if (ok) showResult('已提交: ' + val, false);
        else showResult('提交失败', true);
      };
      row.appendChild(input);
      row.appendChild(btn);
      body.appendChild(row);
      break;
    }
    case 'editor': {
      const title = document.createElement('div');
      title.className = 'ui-widget-title';
      if (q.title) title.textContent = q.title;
      body.appendChild(title);
      const row = document.createElement('div');
      row.className = 'ui-widget-input-row';
      const ta = document.createElement('textarea');
      ta.value = q.prefill || '';
      const submitEditor = async () => {
        if (widget._submitted) return;
        widget._submitted = true;
        disableAll();
        const ok = await sendUIResponse(q.id, { value: ta.value });
        if (ok) showResult('已提交', false);
        else showResult('提交失败', true);
      };
      const cancelEditor = async () => {
        if (widget._submitted) return;
        widget._submitted = true;
        disableAll();
        const ok = await sendUIResponse(q.id, { cancelled: true });
        if (ok) showResult('已取消', true);
        else showResult('提交失败', true);
      };
      widget._keyHandler = (e) => {
        if (e.key === 'Escape') { e.preventDefault(); cancelEditor(); }
        else if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submitEditor(); }
      };
      document.addEventListener('keydown', widget._keyHandler);
      row.appendChild(ta);
      body.appendChild(row);
      const footer = document.createElement('div');
      footer.className = 'ui-widget-footer';
      const btnOk = document.createElement('button');
      btnOk.className = 'ui-widget-btn ui-widget-btn-confirm';
      btnOk.textContent = '确认';
      btnOk.onclick = submitEditor;
      const btnCancel = document.createElement('button');
      btnCancel.className = 'ui-widget-btn ui-widget-btn-cancel';
      btnCancel.textContent = '取消';
      btnCancel.onclick = cancelEditor;
      footer.appendChild(btnOk);
      footer.appendChild(btnCancel);
      body.appendChild(footer);
      break;
    }
  }

  widget.appendChild(body);
  return widget;
}

// --- sessions ---
async function createSession(){
  try {
    const r = await fetch(baseUrl() + '/sessions', { method:'POST', headers:authHeaders(), body:'{}' });
    const d = await r.json();
    if (!r.ok) { alert('创建失败: ' + (d.error || d.message || r.status)); return; }
    currentSessionId = d.sessionId;
    await listSessions();
    enableChat();
  } catch(e) { alert('Error: ' + e.message); }
}

async function listSessions(){
  try {
    const r = await fetch(baseUrl() + '/admin/api/sessions', { headers:authHeaders() });
    const d = await r.json();
    const list = $('#sessions-list');
    if (!d.sessions || d.sessions.length === 0) {
      list.innerHTML = '<div style="font-size:11px;color:#484f58;padding:8px">无活跃会话</div>';
      return;
    }
    list.innerHTML = d.sessions.map(s => {
      const active = s.sessionId === currentSessionId ? ' active' : '';
      const sid = s.sessionId.replace(/"/g, '&quot;');
      return `<div class="session-item${active}" data-sid="${sid}">
        <span class="sid" title="${sid}">${sid.slice(0,16)}...</span>
        <button class="del-btn" data-del="${sid}" title="删除">&times;</button>
      </div>`;
    }).join('');
  } catch(e) {}
}

async function deleteSession(sid){
  if (!confirm('删除会话 ' + sid.slice(0,20) + '... ?')) return;
  await fetch(baseUrl() + '/sessions/' + sid, { method:'DELETE', headers:authHeaders() });
  if (currentSessionId === sid) {
    currentSessionId = null;
    disableChat();
  }
  await listSessions();
}

function selectSession(sid){
  currentSessionId = sid;
  listSessions();
  enableChat();
}

function enableChat(){
  $('#chat-input').disabled = false;
  $('#btn-send').disabled = false;
  $('#chat-input').focus();
}
function disableChat(){
  $('#chat-input').disabled = true;
  $('#btn-send').disabled = true;
  currentSessionId = null;
}

// --- chat SSE ---
async function sendChat(){
  if (!currentSessionId) return alert('请先选择或创建会话');
  const msg = $('#chat-input').value.trim();
  if (!msg) return;
  $('#chat-input').value = '';

  outputAppend('<div class="divider"></div><div class="msg msg-user"><div class="msg-content">' + escapeHtml(msg) + '</div></div>');

  const btn = $('#btn-send');
  const abortBtn = $('#btn-abort');
  btn.style.display = 'none';
  abortBtn.style.display = '';
  $('#chat-input').disabled = true;

  abortController = new AbortController();

  try {
    const r = await fetch(baseUrl() + '/sessions/' + currentSessionId + '/chat', {
      method:'POST', headers:authHeaders(),
      body: JSON.stringify({ message: msg }),
      signal: abortController.signal,
    });

    if (!r.ok) {
      const err = await r.json().catch(() => ({ error: r.statusText }));
      outputAppend('<div class="error">HTTP ' + r.status + ': ' + (err.error || err.message) + '</div>');
      return;
    }

    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      while (true) {
        buf = buf.replace(/\r\n/g, '\n');
        const idx = buf.indexOf('\n\n');
        if (idx === -1) break;
        const frame = buf.slice(0, idx);
        buf = buf.slice(idx + 2);

        if (frame.startsWith(':')) { outputAppend('<div class="info">♥ heartbeat</div>'); continue; }

        const em = frame.match(/^event: (.+)/m);
        const dm = frame.match(/^data: (.+)/m);
        if (!em || !dm) continue;

        const type = em[1];
        let payload;
        try { payload = JSON.parse(dm[1]); } catch(e) { continue; }

        renderSSEEvent(type, payload);
      }
    }
  } catch(e) {
    if (e.name !== 'AbortError') outputAppend('<div class="error">' + escapeHtml(e.message) + '</div>');
  } finally {
    btn.style.display = '';
    abortBtn.style.display = 'none';
    $('#chat-input').disabled = false;
    $('#chat-input').focus();
    abortController = null;
  }
}

function abortChat(){
  if (abortController) abortController.abort();
  if (currentSessionId) {
    fetch(baseUrl() + '/sessions/' + currentSessionId + '/abort', { method:'POST', headers:authHeaders() }).catch(()=>{});
  }
}

function renderSSEEvent(type, p) {
  switch (type) {
    case 'agent_start': {
      const msg = document.createElement('div');
      msg.className = 'msg msg-ai';
      msg.innerHTML = '<div class="msg-label">pi</div>';
      const content = document.createElement('div');
      content.className = 'msg-content';
      msg.appendChild(content);
      $('#output').appendChild(msg);
      currentMsgContent = content;
      break;
    }
    case 'agent_end':
      if (streamBlock && streamBlockType === 'text' && streamBuffer) {
        streamBlock.className += ' md-content';
        streamBlock.innerHTML = renderMarkdown(streamBuffer);
      }
      streamBlock = null;
      streamBuffer = '';
      streamBlockType = '';
      if (p.messages) {
        const last = p.messages[p.messages.length - 1];
        if (last?.usage) {
          const meta = document.createElement('div');
          meta.className = 'msg-meta';
          meta.textContent = 'tokens: ' + (last.usage.totalTokens ?? 'N/A') + ' | cost: $' + (last.usage.cost?.total ?? 0).toFixed(6);
          currentMsgContent.appendChild(meta);
        }
      }
      currentMsgContent = null;
      break;
    case 'turn_start':
    case 'turn_end':
    case 'message_start':
    case 'message_end':
      break;
    case 'message_update': {
      const sub = p.assistantMessageEvent;
      if (!sub) return;
      switch(sub.type) {
        case 'thinking_start': {
          const id = 'th-' + Math.random().toString(36).slice(2,8);
          const block = document.createElement('div');
          block.className = 'thinking-block';
          block.id = id;
          const header = document.createElement('div');
          header.className = 'thinking-header';
          header.innerHTML = '💭 Thinking<span class="thinking-toggle">点击展开</span>';
          header.onclick = () => toggleFold(id, 'thinking-body');
          const body = document.createElement('div');
          body.className = 'thinking-body';
          block.appendChild(header);
          block.appendChild(body);
          currentMsgContent.appendChild(block);
          outputAppendTo(body);
          break;
        }
        case 'thinking_delta':
          outputAppendStream(sub.delta || '');
          break;
        case 'thinking_end':
          streamBlock = null;
          streamBuffer = '';
          streamBlockType = '';
          break;
        case 'text_start':
          outputAppendBlock('div', 'text');
          break;
        case 'text_delta':
          outputAppendStream(sub.delta || '');
          break;
        case 'text_end':
          if (streamBlock) {
            const text = sub.content || sub.text || streamBuffer;
            if (text && (streamBlockType === 'text' || streamBlock.className === 'text')) {
              streamBlock.className += ' md-content';
              streamBlock.innerHTML = renderMarkdown(text);
            } else if (text) {
              streamBlock.textContent = text;
            }
          }
          streamBlock = null;
          streamBuffer = '';
          streamBlockType = '';
          break;
        case 'toolcall_start': {
          const contentBlock = sub.partial?.content?.[sub.contentIndex];
          const name = escapeHtml((contentBlock?.name) || '');
          const tcId = (contentBlock?.id || '').slice(0,8);
          const argsObj = contentBlock?.arguments || contentBlock?.args || {};
          const id = 'tc-' + Math.random().toString(36).slice(2,8);
          toolcallBlocks[id] = { argsObj, name, tcId };
          let argsHtml = '';
          try {
            const argsStr = typeof argsObj === 'string' ? argsObj : JSON.stringify(argsObj, null, 2);
            argsHtml = '<pre><code>' + escapeHtml(argsStr) + '</code></pre>';
          } catch(e) { argsHtml = '<pre><code>' + escapeHtml(String(argsObj)) + '</code></pre>'; }
          outputAppend('<div class="toolcall-block" id="' + id + '"><div class="toolcall-header" onclick="toggleFold(\'' + id + '\',\'toolcall-body\')">🔧 ' + name + ' <span style="color:#8b949e">#' + tcId + '</span><span class="fold-toggle" style="margin-left:auto;font-size:10px;color:#d2a8ff">点击展开</span></div><div class="toolcall-body">' + argsHtml + '</div></div>');
          break;
        }
        case 'toolcall_delta': {
          const delta = sub.delta || '';
          for (const [_id, block] of Object.entries(toolcallBlocks)) {
            if (block.argsObj && typeof block.argsObj === 'string') {
              block.argsObj += delta;
            }
          }
          break;
        }
        case 'toolcall_end': {
          const finalTc = sub.toolCall || {};
          for (const [id, block] of Object.entries(toolcallBlocks)) {
            if (block.name === finalTc.name && (!block.tcId || block.tcId === (finalTc.id || '').slice(0,8))) {
              const el = document.getElementById(id);
              if (el) {
                const body = el.querySelector('.toolcall-body');
                const argsStr = typeof finalTc.arguments === 'string'
                  ? finalTc.arguments
                  : JSON.stringify(finalTc.arguments || finalTc.args || block.argsObj, null, 2);
                if (body) body.innerHTML = '<pre><code>' + escapeHtml(argsStr) + '</code></pre>';
                const header = el.querySelector('.toolcall-header');
                if (header) {
                  header.innerHTML = '🔧 ' + escapeHtml(finalTc.name || block.name)
                    + ' <span style="color:#8b949e">#' + ((finalTc.id || '').slice(0,8) || block.tcId) + '</span>'
                    + '<span class="fold-toggle" style="margin-left:auto;font-size:10px;color:#d2a8ff">点击展开</span>';
                  header.onclick = () => toggleFold(id, 'toolcall-body');
                }
              }
              delete toolcallBlocks[id];
              break;
            }
          }
          break;
        }
        case 'done':
          if (streamBlock && streamBlockType === 'text') {
            const doneText = (sub.message?.content || []).filter(c => c.type === 'text').map(c => c.text).join('\n');
            if (doneText) {
              streamBlock.className += ' md-content';
              streamBlock.innerHTML = renderMarkdown(doneText);
            }
          }
          streamBlock = null;
          streamBuffer = '';
          streamBlockType = '';
          outputAppend('<div class="info" style="margin:6px 0">✅ done (' + (sub.reason || '') + ')</div>');
          break;
        default:
          outputAppend('<div class="info">message_update.' + sub.type + '</div>');
      }
      break;
    }
    case 'tool_execution_start': {
      const id = 'te-' + Math.random().toString(36).slice(2,8);
      const block = document.createElement('div');
      block.className = 'toolexec-block';
      block.id = id;
      const header = document.createElement('div');
      header.className = 'toolexec-header';
      const argsPreview = p.args ? JSON.stringify(p.args, null, 2) : '';
      const truncated = argsPreview.length > 120 ? argsPreview.slice(0, 120) + '...' : argsPreview;
      header.innerHTML = '▶ exec: ' + escapeHtml(p.toolName || '') + ' <span style="color:#484f58;font-size:10px">' + escapeHtml(truncated) + '</span><span class="fold-toggle" style="margin-left:auto;font-size:10px;color:#a5d6ff">点击展开</span>';
      header.onclick = () => toggleFold(id, 'toolexec-body');
      const body = document.createElement('div');
      body.className = 'toolexec-body';
      if (argsPreview) {
        body.innerHTML = '<pre><code>' + escapeHtml(argsPreview) + '</code></pre><div class="md-content"></div>';
      }
      block.appendChild(header);
      block.appendChild(body);
      currentMsgContent.appendChild(block);
      break;
    }
    case 'tool_execution_update':
      break;
    case 'tool_execution_end': {
      const blocks = currentMsgContent.querySelectorAll('.toolexec-block');
      const block = blocks[blocks.length - 1];
      if (block) {
        const body = block.querySelector('.toolexec-body');
        if (body) {
          const text = extractToolResult(p.result);
          let mdContainer = body.querySelector('.md-content');
          if (!mdContainer) {
            mdContainer = document.createElement('div');
            mdContainer.className = 'md-content';
            body.appendChild(mdContainer);
          }
          if (text !== undefined && text !== null && text !== '') {
            mdContainer.innerHTML = renderMarkdown(text);
          } else {
            const empty = document.createElement('div');
            empty.style.cssText = 'font-size:11px;color:#484f58;font-style:italic;padding:4px 0';
            empty.textContent = '(no output)';
            mdContainer.appendChild(empty);
          }
        }
        const exit = document.createElement('div');
        exit.className = 'toolexec-exit';
        exit.textContent = 'exit: ' + (p.isError ? 'error' : 'ok');
        block.appendChild(exit);
      }
      break;
    }
    case 'compaction_start':
    case 'compaction_end':
    case 'auto_retry_start':
    case 'auto_retry_end':
    case 'queue_update':
      outputAppend('<div class="info">' + escapeHtml(
        type === 'queue_update' ? ('queue: s=' + (p.steering?.length||0) + ' f=' + (p.followUp?.length||0)) : type
      ) + '</div>');
      break;
    case 'notification':
      outputAppend('<div class="info">🔔 ' + escapeHtml(p.message || '') + '</div>');
      break;
    case 'status_update':
      outputAppend('<div class="info">📊 ' + escapeHtml(p.statusKey) + ': ' + escapeHtml(p.statusText) + '</div>');
      break;
    case 'widget_update':
      outputAppend('<div class="info">📦 ' + escapeHtml(p.widgetKey) + '</div>');
      break;
    case 'title_update':
      outputAppend('<div class="info">📝 ' + escapeHtml(p.title) + '</div>');
      break;
    case 'editor_text_update':
      outputAppend('<div class="info">📄 editor_text_update</div>');
      break;
    case 'user_question':
      if (currentMsgContent) {
        currentMsgContent.appendChild(buildUIWidget(p));
      } else {
        $('#output').appendChild(buildUIWidget(p));
      }
      $('#output').scrollTop = $('#output').scrollHeight;
      break;
    case 'extension_error':
      outputAppend('<div class="error">extension_error: ' + escapeHtml(p.error || '') + '</div>');
      break;
    case 'error':
      outputAppend('<div class="error">⚠ ' + escapeHtml(p.message || '') + '</div>');
      break;
    default:
      outputAppend('<div class="info">event: ' + type + '</div>');
  }
}

// --- shortcuts ---
async function quickAction(action) {
  if (!currentSessionId) { alert('请先选择或创建会话'); return; }
  const sid = currentSessionId;
  let url, method = 'GET', body;

  switch(action){
    case 'state': url = '/sessions/' + sid + '/state'; break;
    case 'models': url = '/sessions/' + sid + '/models'; break;
    case 'stats': url = '/sessions/' + sid + '/stats'; break;
    case 'bash': url = '/sessions/' + sid + '/bash'; method = 'POST'; body = JSON.stringify({command: 'echo ok'}); break;
    case 'config': url = '/sessions/' + sid + '/config'; method = 'PUT'; break;
    case 'pending-ui': url = '/sessions/' + sid + '/pending-ui-requests'; break;
    case 'messages': url = '/sessions/' + sid + '/messages'; break;
  }

  try {
    const opts = { method, headers: authHeaders() };
    if (body) opts.body = body;
    const r = await fetch(baseUrl() + url, opts);
    const text = JSON.stringify(await r.json(), null, 2);
    showResponse(action.toUpperCase() + ' - HTTP ' + r.status, text);
  } catch(e) {
    showResponse(action, 'Error: ' + e.message);
  }
}

// --- setup event listeners ---
$('#btn-create-session').addEventListener('click', createSession);
$('#btn-delete-session').addEventListener('click', () => {
  if (!currentSessionId) return alert('请先选择会话');
  deleteSession(currentSessionId);
});
$('#btn-send').addEventListener('click', sendChat);
$('#btn-abort').addEventListener('click', abortChat);
$('#chat-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
});
$('#sessions-list').addEventListener('click', (e) => {
  const item = e.target.closest('.session-item');
  if (!item) return;
  if (e.target.closest('.del-btn')) {
    deleteSession(item.dataset.sid);
    return;
  }
  selectSession(item.dataset.sid);
});
// close response overlay on Escape
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeResponse();
});

// poll sessions list periodically
setInterval(() => { if (currentSessionId) listSessions(); }, 5000);
setInterval(checkConnection, 30000);

// startup
setTimeout(listSessions, 1000);
